{{> partials/header }}
{{> partials/navbar }}

<div class="ui container" style="margin-top: 80px; margin-bottom: 80px;">
    <div class="ui icon error message">
        <i class="warning circle icon"></i>
        <div class="content">
            <div class="header">
                Oops! Page non trouvée.
            </div>
            <p>{{message}}</p>
        </div>
    </div>
    
    <div class="ui center aligned segment">
        <a href="javascript:history.back()" class="ui button">
            <i class="arrow left icon"></i> Retour
        </a>
        <a href="/" class="ui primary button">
            <i class="home icon"></i> Accueil
        </a>
        {{#activeUser}}
        <a href="/dashboard" class="ui secondary button">
            <i class="dashboard icon"></i> Dashboard
        </a>
        {{/activeUser}}
    </div>
</div>

{{> partials/footer }}
