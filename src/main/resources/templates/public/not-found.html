<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée - Portfolio Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.6; color: #1f2937; }
        .container { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; padding: 30px; }
        .content { background: white; padding: 50px; border-radius: 16px; text-align: center; max-width: 450px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { font-size: 1.75rem; margin-bottom: 12px; }
        .message { color: #6b7280; margin-bottom: 24px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 8px; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <div class="content">
        <div class="icon">🔍</div>
        <h1>Page non trouvée</h1>
        <p class="message">{{message}}</p>
        <a href="/" class="btn">← Retour à l'accueil</a>
    </div>
</div>
</body>
</html>
